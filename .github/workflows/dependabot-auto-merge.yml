name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # El autor del PR, no el actor del evento: el actor se puede falsificar
    # haciendo que otro usuario dispare el evento sobre una rama de Dependabot.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Los bumps major (ej: una migración de mayor de una dependencia) quedan
      # siempre para revisión manual; solo patch/minor se auto-mergean.
      - name: Activar auto-merge para patch/minor
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
